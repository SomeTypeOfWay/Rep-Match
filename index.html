<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rep Match</title>
<meta name="description" content="Pick muscles and gear, match a workout style, set your time, go. 254 exercises with animated keyframe demos.">
<meta name="theme-color" content="#F4F1F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rep Match">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}html{height:100vh;height:100dvh}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: every screen fits one viewport. Header, a flexible view that shares out the height, and the action dock.
   Red is reserved for selected muscles, work intervals and Go; blue marks rest. */
:root{
  --bg:#141113; --surface:#1E1A1C; --surface-2:#2A2527; --line:#3A3235;
  --ink:#F6F1F2; --ink-2:#AEA4A7; --ink-3:#766C6F;
  --accent:#FF3B47; --accent-ink:#FFFFFF; --accent-soft:#3F1A1F;
  --rest:#52B8E4; --rest-soft:#15303C;
  --warm:#F2A93B;
  --body:#2E282A; --muscle:#4E4548; --muscle-hi:#685C60; --gap:#141113;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --f-display:"Big Shoulders Display","Big Shoulders","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4F1F1; --surface:#FFFFFF; --surface-2:#ECE7E7; --line:#DCD4D5;
  --ink:#1A1416; --ink-2:#655B5E; --ink-3:#9A9093;
  --accent:#E11F2D; --accent-ink:#FFFFFF; --accent-soft:#FBE0E2;
  --rest:#147FAD; --rest-soft:#DCEEF6;
  --warm:#B86E00;
  --body:#DED7D8; --muscle:#BFB4B6; --muscle-hi:#A99DA0; --gap:#F4F1F1;
  --shadow:0 18px 40px rgba(40,20,25,.16);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F1F1; --surface:#FFFFFF; --surface-2:#ECE7E7; --line:#DCD4D5;
  --ink:#1A1416; --ink-2:#655B5E; --ink-3:#9A9093;
  --accent:#E11F2D; --accent-ink:#FFFFFF; --accent-soft:#FBE0E2;
  --rest:#147FAD; --rest-soft:#DCEEF6;
  --warm:#B86E00;
  --body:#DED7D8; --muscle:#BFB4B6; --muscle-hi:#A99DA0; --gap:#F4F1F1;
  --shadow:0 18px 40px rgba(40,20,25,.16);
  color-scheme:light}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1E1A1C; --surface-2:#2A2527; --line:#3A3235;
  --ink:#F6F1F2; --ink-2:#AEA4A7; --ink-3:#766C6F;
  --accent:#FF3B47; --accent-ink:#FFFFFF; --accent-soft:#3F1A1F;
  --rest:#52B8E4; --rest-soft:#15303C;
  --warm:#F2A93B;
  --body:#2E282A; --muscle:#4E4548; --muscle-hi:#685C60; --gap:#141113;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0;height:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top,0px)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:8px 4px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*{flex:none}
.view>.fill{flex:1 1 auto;min-height:0}

/* ---------- header ---------- */
.top{flex:none;padding-block:4px 4px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:900;font-size:21px;letter-spacing:.02em;text-transform:uppercase;line-height:1;white-space:nowrap}
.mark i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.mark i::before{content:"";width:10px;height:10px;border-radius:50%;border:3px solid var(--accent-ink)}
.brand small{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:right;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.rail button{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.rail button:disabled{cursor:default}
.rail i{display:block;height:4px;border-radius:2px;background:var(--line)}
.rail span{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .done i{background:var(--ink-2)}
.rail .done span{color:var(--ink-2)}
.rail .cur i{background:var(--accent)}
.rail .cur span{color:var(--ink)}

/* ---------- type ---------- */
.h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8.6vw,38px);line-height:.92;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
.lede{margin:5px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.35;max-width:46ch}
.h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-weight:600;font-size:14.5px;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{color:var(--ink-2)}
.chip b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.chip.warn{border-color:var(--warm);color:var(--warm)}

/* ---------- body map ---------- */
.map{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:24px;padding:10px 10px 10px;min-height:260px}
.map-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2)}
.seg button{height:30px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.figs{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.fig{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:0}
.fig svg{flex:1;min-height:0;width:100%;max-width:190px;height:100%;display:block;overflow:visible}
.fig .label{flex:none}
svg.body path{stroke:var(--gap);stroke-width:1.4;stroke-linejoin:round;fill:var(--body)}
svg.body path.m{fill:var(--muscle);transition:fill .15s}
svg.body.tap path.m{cursor:pointer}
@media (hover:hover){svg.body.tap path.m:hover{fill:var(--muscle-hi)}}
svg.body path.m.on,svg.body.tap path.m.on:hover{fill:var(--accent)}
svg.body path.m.pri{fill:var(--hot,var(--accent))}
svg.body path.m.sec{fill:color-mix(in srgb,var(--hot,var(--accent)) 45%,var(--muscle))}
.map-count{font-size:13px;font-weight:600;color:var(--ink-2);padding-right:4px}
.grid-m{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(36px,1fr);gap:6px;overflow-y:auto;max-height:480px}
.mbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:0;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:transparent;text-align:left;font-weight:600;font-size:15px;min-width:0}
.mbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn em{font-style:normal;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mbtn[aria-pressed="true"] em{color:var(--ink-2)}

/* ---------- equipment ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);min-height:300px;gap:8px;max-height:560px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;justify-content:flex-start;min-height:0;padding:10px 10px 9px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;overflow:hidden}
.tile svg.ic{flex:none;width:24px;height:24px;margin-bottom:auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-2)}
.tile strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:700;line-height:1.1;margin-top:4px}
.tile .ck{position:absolute;right:9px;top:9px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.tile .ck svg{width:13px;height:13px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tile[aria-pressed="true"] svg.ic{color:var(--accent)}
.tile[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.tile[aria-pressed="true"] .ck svg{opacity:1}
.tile .cnt{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- match ---------- */
.summary{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:18px;background:var(--surface)}
.summary .big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.85;font-variant-numeric:tabular-nums}
.summary p{flex:1;min-width:0;margin:0;font-size:13px;color:var(--ink-2);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.summary p strong{display:block;color:var(--ink);font-size:14.5px}
.btn-s.sq{width:40px;padding:0;justify-content:center}
.btn-s{flex:none;height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.btn-s svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.notice{padding:8px 12px;border-radius:12px;border:1.5px dashed var(--warm);color:var(--ink);font-size:13.5px;line-height:1.3}
.notice b{color:var(--warm)}
.cards{display:flex;flex-direction:column;gap:12px}
.fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fmt{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:48px;padding:6px 9px;border:1.5px solid var(--line);border-radius:12px;background:transparent;text-align:left}
.fmt strong{font-size:13.5px;font-weight:700;line-height:1.1}
.fmt small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fmt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fmt[aria-checked="true"] small{color:var(--accent)}
.wcard{display:flex;flex-direction:column;gap:9px;width:100%;padding:13px 14px 12px;border-radius:20px;border:1.5px solid var(--accent);background:var(--surface);text-align:left;min-height:150px;overflow:hidden}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wtop h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:.95;text-transform:uppercase}
.wtop .goal{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--surface-2);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.pill.r{background:var(--accent-soft);color:var(--accent)}
.radio{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.radio svg{width:13px;height:13px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.wcard[aria-pressed="true"] .radio{background:var(--accent);border-color:var(--accent)}
.wcard[aria-pressed="true"] .radio svg{opacity:1}
.wcard p.blurb{margin:0;font-size:14px;line-height:1.35;color:var(--ink-2)}
.profile{display:block;width:100%;height:30px;flex:none}
.profile .w{fill:var(--accent)}
.profile .h{fill:color-mix(in srgb,var(--accent) 70%,var(--surface))}
.profile .r{fill:var(--line)}
.wlist{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;flex:1 1 auto;min-height:27px;overflow:hidden}
.wlist li[hidden]{display:none}
.wlist li{font-size:13.5px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--surface-2);color:var(--ink)}
.wlist li.more{background:transparent;color:var(--ink-3);padding-inline:2px}
.wmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.exlist{display:flex;flex-direction:column;border-radius:20px;background:var(--surface);overflow:hidden}
.exgroup{padding:10px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow .nm{border:0;background:none;padding:0;text-align:left;min-width:0;display:flex;align-items:center;gap:12px}
.exrow .nm>span:last-child{min-width:0}
.exrow .nm strong{display:block;font-size:15px;font-weight:600}
.exrow .nm small{display:block;font-size:13px;color:var(--ink-3)}
.exrow.off .nm strong{color:var(--ink-3);text-decoration:line-through}
.tog{height:32px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:13px;font-weight:700;color:var(--ink-2)}
.exrow.off .tog{border-color:var(--ink-3);color:var(--ink)}

/* ---------- time ---------- */
.clock{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 12px 12px;border-radius:22px;background:var(--surface)}
.clock-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.clock .n{display:flex;align-items:baseline;justify-content:center;gap:6px;font-family:var(--f-display);font-weight:900;font-size:clamp(60px,18vw,76px);line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-align:center}
.clock .u{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.presets{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%}
.presets .chip{height:34px;padding:0;justify-content:center;font-size:14px}
.step-btn{width:50px;height:50px;flex:none;border-radius:16px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.step-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.step-btn:disabled{opacity:.3;cursor:default}
.split{display:flex;gap:3px;height:8px;width:100%}
.split i{display:block;border-radius:3px;min-width:4px}
.split .a{background:var(--warm)} .split .b{background:var(--accent)} .split .c{background:var(--rest)}
.legend{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 14px;width:100%;font-size:13px;font-weight:600;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:8px;height:8px;border-radius:2px}
.legend strong{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.legend em{font-style:normal;color:var(--ink-3);margin-left:-8px}
.plan{display:flex;flex-direction:column;border-radius:20px;background:var(--surface);overflow:hidden;min-height:170px}
.plan-h{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.plan-h .h2{font-size:21px;white-space:nowrap}
.plan-h .label{text-align:right;font-size:11px;line-height:1.3}
.plan-sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 14px 5px;border-top:1px solid var(--line);background:var(--surface-2)}
.blk-h strong{font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.blk-h span{font-size:12px;font-weight:600;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:20px 44px minmax(0,1fr) 34px;align-items:center;gap:8px;padding:5px 10px 5px 8px;border-top:1px solid var(--line);min-height:48px}
.prow:first-child{border-top:0}
.prow .th{border:0;background:none;padding:0}
.prow .thumb{width:44px}
.prow .tag{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ink-3);text-align:center}
.prow .nm{border:0;background:none;padding:0;text-align:left;min-width:0}
.prow .nm strong{display:block;font-size:14.5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{display:block;font-size:12.5px;line-height:1.3;color:var(--ink-2);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small i{font-style:normal;color:var(--ink-3)}
.prow.soft{grid-template-columns:20px minmax(0,1fr)}
.prow.soft .nm strong span{font-weight:600;color:var(--ink-3);margin-left:4px}
.sw{display:block;width:8px;height:22px;margin:0 auto;border-radius:3px}
.sw.a{background:var(--warm)} .sw.c{background:var(--rest)}
.swap{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.swap svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- dock ---------- */
.dock{flex:none;padding:8px 0 calc(12px + var(--safe-bot,0px))}
.dock .in{display:flex;align-items:center;gap:10px}
.dock .info{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.25}
.dock .info strong{display:block;color:var(--ink);font-size:16px}
.back{width:54px;height:54px;flex:none;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center}
.back svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cta{height:54px;flex:1;min-width:0;border:0;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;white-space:nowrap}
.cta svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cta:disabled{opacity:.35;cursor:default}
.cta.go{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.08em;text-transform:uppercase}
.cta.auto{flex:0 0 auto}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:calc(100% - 24px - var(--safe-top,0px));overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow);
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + var(--safe-bot,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:.95;text-transform:uppercase}
.x{width:40px;height:40px;flex:none;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center}
.x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.mini{display:flex;gap:4px;justify-content:center}
.mini svg{width:72px;height:auto}
.sheet .mini svg{width:64px}
.sheet .stage{height:clamp(150px,30vh,280px)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14.5px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;font-weight:600}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14.5px;line-height:1.35}
.cues li::marker{color:var(--accent);font-weight:700}
.linkbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;background:var(--surface-2);font-weight:700;font-size:15px;text-decoration:none}
.linkbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sheet .tog2{height:44px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:15px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-bot,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14.5px;text-align:center;box-shadow:var(--shadow)}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:hidden;
  padding:calc(8px + var(--safe-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + var(--safe-bot,0px)) max(16px,env(safe-area-inset-left,0px))}
.player .in{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.pl-top{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px}
.pl-tools{display:flex;gap:8px;justify-content:flex-end}
.pbtn.on{background:var(--ink);color:var(--bg)}
.pbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.pbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pl-clock{text-align:center;line-height:1.1}
.pl-clock b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.pl-clock span{font-size:12.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pl-prog{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pl-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s linear}
.pl-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
.pl-body::-webkit-scrollbar{display:none}
.pl-body>*{flex:none}
.pl-body>.fill{flex:1 1 auto;min-height:0}
.phase{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phase .dot{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent)}
.phase .dot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.phase .dot.rest{background:var(--rest-soft);color:var(--rest)}
.phase .dot.warm{background:color-mix(in srgb,var(--warm) 18%,transparent);color:var(--warm)}
.phase span{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.pl-name{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:.9;text-transform:uppercase;text-wrap:balance}
.pl-set{font-size:15px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.target{display:flex;align-items:flex-end;gap:12px}
.target .v{font-family:var(--f-display);font-weight:900;font-size:clamp(96px,30vw,132px);line-height:.78;font-variant-numeric:tabular-nums;white-space:nowrap}
.target .v.range{font-size:clamp(68px,21vw,104px)}
.target .t{padding-bottom:6px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);line-height:1.2}
.target .t small{display:block;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink-3);font-size:13.5px}
.ringwrap{position:relative;width:min(240px,64vw,36vh);aspect-ratio:1;max-width:100%;margin:4px auto 0}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:7}
.ringwrap .bg{stroke:var(--surface-2)}
.ringwrap .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringwrap.rest .fg{stroke:var(--rest)}
.ringwrap.warm .fg{stroke:var(--warm)}
.ringwrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ringwrap .rt b{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,20vw,84px);line-height:.85;font-variant-numeric:tabular-nums}
.ringwrap .rt span{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.how{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:14px;border-radius:20px;background:var(--surface)}
.how .mini svg{width:52px}
.how .cues{font-size:14.5px}
.how a{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:700;color:var(--ink-2);text-decoration:none}
.how a svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none}
.next{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:18px;background:var(--surface)}
.next .thumb{width:84px}
.next .label{flex:none}
.next div{min-width:0}
.next strong{display:block;font-size:16px;font-weight:700}
.next small{display:block;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.amlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;border-radius:18px;background:var(--surface);overflow-y:auto}
.amlist li{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 10px;border-top:1px solid var(--line);font-weight:600}
.amlist li b{flex:1;min-width:0;font-weight:600}
.amlist .thumb{width:56px}
.amlist li:first-child{border-top:0}
.amlist li span{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rounds{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 12px 16px;border-radius:18px;background:var(--surface)}
.rounds b{display:block;font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.rounds .grp{display:flex;gap:8px}
.ctrls{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,4fr);gap:10px;align-items:center;padding-top:2px}
.ctrl{height:58px;border-radius:20px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;font-weight:700;font-size:14px}
.ctrl svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ctrl:disabled{opacity:.3;cursor:default}
.ctrl.main{border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px}
.ctrl.main.dim{background:var(--ink);color:var(--bg)}
.ctrl.main.rest{background:var(--rest);color:#fff}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px}
.modal .box{width:100%;max-width:360px;background:var(--surface);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.modal p{margin:0;color:var(--ink-2);font-size:15px}
.modal .row{display:flex;gap:10px}
.modal .row button{flex:1;height:50px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:700}
.modal .row button.danger{border:0;background:var(--accent);color:var(--accent-ink)}
.fin{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:12px;overflow-y:auto}
.fin .cta{flex:none}
.fin h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:72px;line-height:.85;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{padding:14px;border-radius:18px;background:var(--surface)}
.stats b{display:block;font-family:var(--f-display);font-weight:900;font-size:36px;line-height:.9;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* ---------- pose figure: line-art, white body, one bold ink outline, grey shorts, coloured soles ---------- */
:root{--fig-ink:#1A1416;--fig-skin:#FFFFFF;--fig-far:#E7E2E3;--fig-shorts:#9C9598;--fig-shorts-far:#8A8386;--fig-shoe:#EEF1F4;--fig-hot:var(--accent);--prop-fill:#FFFFFF;--prop-w:#8E8689;--ow2:2.2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fig-ink:#0E0B0C;--fig-skin:#F3EEEF;--fig-far:#C9C1C3;--fig-shorts:#8A8285;--fig-shorts-far:#746D70;--fig-shoe:#E1E5E8;--prop-fill:#DCD5D7;--prop-w:#8A8285}}
:root[data-theme="dark"]{--fig-ink:#0E0B0C;--fig-skin:#F3EEEF;--fig-far:#C9C1C3;--fig-shorts:#8A8285;--fig-shorts-far:#746D70;--fig-shoe:#E1E5E8;--prop-fill:#DCD5D7;--prop-w:#8A8285}
:root[data-theme="light"]{--fig-ink:#1A1416;--fig-skin:#FFFFFF;--fig-far:#E7E2E3;--fig-shorts:#9C9598;--fig-shorts-far:#8A8386;--fig-shoe:#EEF1F4;--prop-fill:#FFFFFF;--prop-w:#8E8689}
svg.fig2{display:block;width:100%;height:auto;overflow:visible}
svg.fig2 line,svg.fig2 path,svg.fig2 polygon{stroke-linecap:round;stroke-linejoin:round}
svg.fig2 .ink path{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:var(--ow2)}
svg.fig2 .sk{fill:var(--fig-skin)}
svg.fig2 .skf{fill:var(--fig-far)}
svg.fig2 .fh{fill:var(--fig-hot)}
svg.fig2 .fhf{fill:color-mix(in srgb,var(--fig-hot) 72%,var(--fig-far))}
svg.fig2 .hp{stroke:var(--fig-ink);stroke-width:.7}
svg.fig2 .shorts{fill:var(--fig-shorts)}
svg.fig2 .shortsf{fill:var(--fig-shorts-far)}
svg.fig2 .shoe{fill:var(--fig-shoe)}
svg.fig2 .sole{fill:var(--fig-hot)}
svg.fig2 .ln{fill:none;stroke:var(--fig-ink);stroke-width:.75}
svg.fig2 .flr{stroke:var(--line);stroke-width:1.2}
svg.fig2 .pO,svg.fig2 .po{stroke:var(--fig-ink)}
svg.fig2 line.pO,svg.fig2 line.pl{stroke-linecap:butt}
svg.fig2 .pl{stroke:var(--prop-fill)}
svg.fig2 .pp,svg.fig2 .pk{fill:var(--prop-fill);stroke:var(--fig-ink);stroke-width:.9}
svg.fig2 line.pw{stroke:var(--prop-w)}
svg.fig2 circle.pw,svg.fig2 rect.pw{fill:var(--prop-w);stroke:var(--fig-ink);stroke-width:.9}
svg.fig2 .ph{fill:var(--prop-fill);stroke:var(--fig-ink);stroke-width:.6}
svg.fig2 .pf{stroke:var(--prop-fill)}
svg.fig2 .pk2o{fill:none;stroke:var(--fig-ink);stroke-width:3.2}
svg.fig2 .pk2{fill:none;stroke:var(--prop-w);stroke-width:1.4}
svg.fig2 .pm{fill:var(--prop-w);stroke:var(--fig-ink);stroke-width:.9}
svg.fig2 .pl2{fill:none;stroke:var(--fig-ink);stroke-width:.8}
svg.fig2 .pc{stroke:var(--ink-3)}
svg.fig2 .pb{stroke:var(--warm);fill:var(--warm)}
.thumb,.film{--ow2:3.2}

/* ---------- keyframe stage + film strip ---------- */
.thumb{display:block;width:58px;flex:none}
.stage{position:relative;display:flex;border-radius:20px;background:var(--surface);padding:8px 10px 4px;cursor:pointer;min-height:0}
.stage.fill{min-height:120px}
.stage .anim{flex:1;min-width:0;min-height:0;display:flex;justify-content:center}
.stage .anim svg{width:100%;height:100%;max-width:440px}
.stage:not(.fill):not(.sheet .stage){aspect-ratio:4/3}
.film{flex:none;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.film button{position:relative;width:100%;height:100%;display:flex;flex-direction:column;gap:3px;padding:6px 7px 7px;border:1.5px solid transparent;border-radius:16px;background:var(--surface);text-align:left;color:var(--ink)}
.film button[aria-current="true"]{border-color:var(--accent)}
.film svg.fig2{height:46px;width:auto;max-width:100%;margin:0 auto}
.film .kn{position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ink-2)}
.film button[aria-current="true"] .kn{background:var(--accent);color:var(--accent-ink)}
.film .kc{font-size:12px;font-weight:600;line-height:1.25;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.film button[aria-current="true"] .kc{color:var(--ink)}
.kvrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.kvrow .mini svg{width:52px}
.trow{display:flex;align-items:center;gap:14px}
.trow .tnote{flex:1;min-width:0}
.mini.sm{margin-left:auto;flex:none;gap:2px}
.mini.sm svg{width:30px}
.trow .target .v{font-size:clamp(64px,20vw,88px)}
.tnote{font-size:14.5px;font-weight:600;line-height:1.3;color:var(--ink-2)}
.ringwrap.sm{width:min(104px,14vh);min-width:84px;margin:0;flex:none}
.ringwrap.sm .rt b{font-size:30px}
.ringwrap.sm .rt b.long{font-size:24px}
.ringwrap.sm .rt span{font-size:10.5px}
.target .v{font-size:clamp(64px,20vw,92px)}
.target .v.range{font-size:clamp(50px,15vw,72px)}

.stage .wf{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:700;text-decoration:none}
.stage .wf svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* tips toggle sits top-left of the demo, Watch form top-right */
.stage .tp{position:absolute;top:10px;left:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 9px;border:0;border-radius:15px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:700}
.stage .tp svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stage .tp[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.tipbox{position:absolute;top:48px;left:10px;right:10px;max-height:calc(100% - 58px);z-index:1;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface) 94%,transparent);overflow-y:auto;cursor:default;box-shadow:0 0 0 1px var(--line)}
.tipbox[hidden]{display:none}
.wcard [data-drop][hidden]{display:none}
/* short phones: drop the subtitle lines and tighten the pickers */
@media (max-height:740px){
  .view .hd .lede{display:none}
  .fmt{min-height:42px;padding-block:4px}
  .sheet .stage{height:clamp(120px,22vh,280px)}
  .sheet .in{gap:10px}
  .sheet{padding-bottom:calc(14px + var(--safe-bot,0px))}
  .film svg.fig2{height:40px}
  .tile svg.ic{width:22px;height:22px}
  .sheet .mini svg{width:52px}
}
@media (max-height:660px){.sheet .stage{height:110px}}

/* Next button: the whole bar is a progress meter. The label is drawn twice so it stays legible on both halves. */
.ctrl.nx{--fc:var(--accent);--p:0%;position:relative;overflow:hidden;container-type:inline-size;border:1.5px solid color-mix(in srgb,var(--fc) 45%,var(--line));background:color-mix(in srgb,var(--fc) 14%,var(--surface));color:var(--ink);padding:0;display:block}
.ctrl.nx.warm{--fc:var(--warm)}
.ctrl.nx.rest{--fc:var(--rest)}
.ctrl.nx .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.08em;text-transform:uppercase}
.ctrl.nx .lbl svg{width:24px;height:24px}
.ctrl.nx .fill{position:absolute;inset:0 auto 0 0;width:var(--p);overflow:hidden;background:var(--fc);color:#fff;transition:width .25s linear}
.ctrl.nx .fill .lbl{inset:0 auto 0 0;width:100cqw}
.ctrl.nx .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 2.4s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
.ctrl.nx:active{transform:scale(.985)}
.ctrl.back{font-size:0}
@media (prefers-reduced-motion: reduce){.ctrl.nx .fill::after{display:none}}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1}
.timer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;font-size:13.5px;font-weight:600;color:var(--ink-2)}

/* muscle highlight follows the phase: amber warm-up, red work, blue cool-down */
.tone-warm{--hot:var(--warm);--fig-hot:var(--warm)}
.tone-cool{--hot:var(--rest);--fig-hot:var(--rest)}
.tone-warm .film button[aria-current="true"]{border-color:var(--warm)}
.tone-warm .film button[aria-current="true"] .kn{background:var(--warm)}
.tone-cool .film button[aria-current="true"]{border-color:var(--rest)}
.tone-cool .film button[aria-current="true"] .kn{background:var(--rest)}

</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
  <div class="dock" id="dock"></div>
</div>
<div id="sheet" hidden></div>
<div class="player" id="player" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ---------- Reference data: muscles, equipment, body map, exercise library ---------- */

const MUSCLES = [
  { id: 'chest', name: 'Chest' },
  { id: 'shoulders', name: 'Shoulders' },
  { id: 'biceps', name: 'Biceps' },
  { id: 'triceps', name: 'Triceps' },
  { id: 'forearms', name: 'Forearms' },

/* ---------- Pose engine: an articulated flat figure, keyframes per move, tweening ----------
   Side view faces right. Limb angles are absolute, measured from straight down, + rotates toward the front (right).
   Torso angle t is measured from straight up, + leans forward. Front view uses "outward" angles per side. */
const FIG = (() => {
  const R2 = Math.PI / 180;
  const dD = a => [Math.sin(a * R2), -Math.cos(a * R2)];
  const dU = a => [Math.sin(a * R2), Math.cos(a * R2)];
  const ad = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  /* proportions: about 7.5 heads tall (Drillis & Contini segment ratios) */
  const LN = { to: 27, ne: 4.2, hd: 6.3, ua: 16.5, fa: 14, ha: 7, th: 23, sh: 22, ft: 10 };
  const OW = 1.1; // outline width in body units
  /* contact radii = drawn radius + outline, so knees, elbows, wrists, heels and toes meet the floor exactly */
  const RAD = { P: 7.4, S: 6.5, H: 7.4, Kn: 5.0, Kf: 5.0, An: 3.2, Af: 3.2, Tn: 2.6, Tf: 2.6, Ln: 3.0, Lf: 3.0, En: 3.7, Ef: 3.7, Wn: 2.8, Wf: 2.8, Hn: 1.4, Hf: 1.4, Sn: 5.4, Sf: 5.4 };
  const LIMBS = ['uan', 'fan', 'han', 'uaf', 'faf', 'haf', 'thn', 'shn', 'ftn', 'thf', 'shf', 'ftf'];
  const SCALES = ['uan', 'fan', 'uaf', 'faf', 'thn', 'shn', 'thf', 'shf'];

  /* forward kinematics */
  function fk(s) {
    const P = [s.x, s.y], u = dU(s.t), q = { P };
    const sc = k => (s.s && s.s[k] != null ? s.s[k] : 1);
    if (s.v === 'front') {
      const perp = [u[1], -u[0]], Sc = ad(P, u, LN.to * (s.ts || 1));
      q.S = Sc; q.Sn = ad(ad(Sc, perp, 9.8), u, s.sh || 0); q.Sf = ad(ad(Sc, perp, -9.8), u, s.sh || 0);
      q.N = ad(Sc, u, LN.ne); q.H = ad(q.N, dU(s.t + (s.h || 0)), LN.hd);
      q.Hpn = ad(P, perp, 5.5); q.Hpf = ad(P, perp, -5.5);
    } else {
      q.S = ad(P, u, LN.to); q.Sn = q.S; q.Sf = q.S; q.N = ad(P, u, LN.to + LN.ne);
      q.H = ad(q.N, dU(s.t + (s.h || 0)), LN.hd); q.Hpn = P; q.Hpf = P;
    }
    const a = s.a;
    for (const k of ['n', 'f']) {
      q['E' + k] = ad(q['S' + k], dD(a['ua' + k]), LN.ua * sc('ua' + k));
      q['W' + k] = ad(q['E' + k], dD(a['fa' + k]), LN.fa * sc('fa' + k));
      q['H' + k] = ad(q['W' + k], dD(a['ha' + k]), LN.ha);
      q['K' + k] = ad(q['Hp' + k], dD(a['th' + k]), LN.th * sc('th' + k));
      q['A' + k] = ad(q['K' + k], dD(a['sh' + k]), LN.sh * sc('sh' + k));
      /* sole frame: d runs heel to toe, n points up from the sole toward the shin */
      const fr = s.v === 'front';
      const d = dD(fr ? a['sh' + k] + (a['ft' + k] - a['sh' + k]) * 90 / 70 : a['ft' + k]);
      let n = [-d[1], d[0]]; const kv = sub(q['K' + k], q['A' + k]); if (n[0] * kv[0] + n[1] * kv[1] < 0) n = [-n[0], -n[1]];
      q['fd' + k] = d; q['fu' + k] = n;
      q['T' + k] = ad(ad(q['A' + k], d, fr ? 6.2 : LN.ft), n, -1.5);
      q['L' + k] = ad(ad(q['A' + k], d, fr ? -1.2 : -2.4), n, -1.1);
    }
    q.hn = ad(q.Wn, dD(a.han), 2.6); q.hf = ad(q.Wf, dD(a.haf), 2.6);
    q.hands = mid(q.hn, q.hf);
    const back = [-Math.cos(s.t * R2), Math.sin(s.t * R2)];
    q.back = back;
    q.nape = ad(ad(q.S, back, 6), u, -1.5);
    q.rack = ad(ad(q.S, back, -6.5), u, -2);
    q.hip = ad(ad(P, back, -8), u, 3);
    q.feet = mid(q.An, q.Af);
    return q;
  }

  /* two-bone IK; b = +1 bends counterclockwise from the start→target line */
  function ik(start, target, L1, L2, b) {
    const v = sub(target, start); let d = Math.hypot(v[0], v[1]);
    d = Math.min(Math.max(d, Math.abs(L1 - L2) + .01), L1 + L2 - .01);
    const al = Math.atan2(v[0], -v[1]) / R2;
    const g = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)) / R2;
    const up = al + b * g, J = ad(start, dD(up), L1), w = sub(target, J);
    return [up, Math.atan2(w[0], -w[1]) / R2];
  }

  /* solve one keyframe into a rig state */
  function solve(spec, fr) {
    const v = spec.v || 'side', R = fr.R || 0;
    const s = { v, x: 0, y: 0, t: (fr.t || 0) - R, h: fr.h || 0, sh: fr.sh || 0, ts: fr.ts || 1, a: {}, s: {} };
    const sa = fr.sa || [1, 1, 1, 1], sl = fr.sl || [1, 1, 1, 1];
    s.s = { uan: sa[0], fan: sa[1], uaf: sa[2], faf: sa[3], thn: sl[0], shn: sl[1], thf: sl[2], shf: sl[3] };
    if (fr.P) { s.x = fr.P[0]; s.y = fr.P[1]; }
    const side = k => (v === 'front' && k === 'f' ? -1 : 1);
    const absA = (k, o) => side(k) * o + R;
    const pre = fk({ ...s, a: Object.fromEntries(LIMBS.map(l => [l, 0])) });
    for (const k of ['n', 'f']) {
      const arm = fr['a' + k] || (v === 'front' ? [6, 8] : k === 'n' ? [4, 7] : [-4, -2]);
      if (Array.isArray(arm)) {
        s.a['ua' + k] = absA(k, arm[0]); s.a['fa' + k] = absA(k, arm[1]); s.a['ha' + k] = absA(k, arm[2] != null ? arm[2] : arm[1]);
      } else {
        const [u1, f1] = ik(pre['S' + k], arm.ik, LN.ua * s.s['ua' + k], LN.fa * s.s['fa' + k], arm.b || 1);
        s.a['ua' + k] = u1; s.a['fa' + k] = f1; s.a['ha' + k] = arm.hand != null ? absA(k, arm.hand) : f1;
      }
      const leg = fr['l' + k] || (v === 'front' ? [4, 2] : k === 'n' ? [2, 0, 90] : [-2, 0, 90]);
      const footDef = sh => v === 'front' ? sh + side(k) * 70 : sh + 90;
      if (Array.isArray(leg)) {
        s.a['th' + k] = absA(k, leg[0]); s.a['sh' + k] = absA(k, leg[1]);
        s.a['ft' + k] = leg[2] != null ? absA(k, leg[2]) : footDef(s.a['sh' + k]);
      } else {
        if (leg.ik[1] <= 3.5) leg.ik = [leg.ik[0], leg.ik[1] + .7];
        const [t1, s1] = ik(pre['Hp' + k], leg.ik, LN.th * s.s['th' + k], LN.sh * s.s['sh' + k], leg.b || 1);
        s.a['th' + k] = t1; s.a['sh' + k] = s1; s.a['ft' + k] = leg.ft != null ? absA(k, leg.ft) : footDef(s1);
      }
    }
    if (fr.P) return s;
    const A = fr.A || spec.A || { j: 'An', x: 0 };
    let q = fk(s);
    if (A.g2) {
      const [j1, j2] = A.g2, ys = A.y || [0, 0], p1 = q[j1], p2 = q[j2];
      const k = (ys[1] - ys[0]) + (RAD[j2] || 0) - (RAD[j1] || 0);
      const vv = sub(p2, p1), D = Math.hypot(vv[0], vv[1]) || 1, al = Math.atan2(vv[1], vv[0]);
      const be = Math.asin(Math.max(-1, Math.min(1, k / D)));
      const c1 = be - al, c2 = (Math.PI - be) - al, norm = x => Math.atan2(Math.sin(x), Math.cos(x));
      const ph = Math.abs(norm(c1)) < Math.abs(norm(c2)) ? norm(c1) : norm(c2), pd = ph / R2;
      for (const l of LIMBS) s.a[l] += pd;
      s.t -= pd;
      const rp = sub([s.x, s.y], p1), c = Math.cos(ph), si = Math.sin(ph);
      s.x = p1[0] + rp[0] * c - rp[1] * si; s.y = p1[1] + rp[0] * si + rp[1] * c;
      q = fk(s);
      s.x += (A.x || 0) - q[j1][0]; s.y += ys[0] + (RAD[j1] || 0) - q[j1][1];
    } else if (A.y != null) {
      s.x += A.x - q[A.j][0]; s.y += A.y - q[A.j][1];
    } else {
      let lo = Infinity;
      for (const n in RAD) if (q[n] && !/^(H|Hn|Hf|P|S|Sn|Sf)$/.test(n)) lo = Math.min(lo, q[n][1] - RAD[n]);
      for (const p of figGeo(q, v, null, { noHandExt: true }).ext) lo = Math.min(lo, p[1] - OW);
      s.x += (A.x || 0) - q[A.j][0]; s.y += -lo;
    }
    s.y += fr.lift || 0;
    return s;
  }

  const lerp = (a, b, k) => a + (b - a) * k;
  const lerpA = (a, b, k) => a + ((((b - a) % 360) + 540) % 360 - 180) * k;
  function mix(A, B, k) {
    const o = { v: A.v, x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k), t: lerpA(A.t, B.t, k), h: lerp(A.h, B.h, k), sh: lerp(A.sh, B.sh, k), ts: lerp(A.ts, B.ts, k), a: {}, s: {} };
    for (const l of LIMBS) o.a[l] = lerpA(A.a[l], B.a[l], k);
    for (const l of SCALES) o.s[l] = lerp(A.s[l], B.s[l], k);
    return o;
  }

function suit(f) {

/* ---------- plan ---------- */

  const out = [q.g.shift()];

}

/* ---------- prescriptions as text ---------- */
function repText(it, s, short) {

    case 'giant': return { t: `Giant set ${L}`, s: `${b.rounds} rounds · rest ${restTxt(b.roundRest)}`, tag: i => L + (i + 1) };
    case 'circuit': return { t: `Circuit ${sameType}`, s: `${b.rounds} round${b.rounds > 1 ? 's' : ''} · 40s on / 20s off`, tag: i => i + 1 };
    case 'emom': return { t: `EMOM ${sameType}`, s: `${b.minutes} min · ${b.items.length} moves in rotation`, tag: i => i + 1 };

/* ---------- compile a plan into timed steps ---------- */
function compile(plan) {
  const st = [];
  const W = (o) => st.push({ k: 'work', ...o });
  const R = (dur, label) => st.push({ k: 'rest', dur, timed: true, label });
  st.push({ k: 'ready', dur: 10, timed: true });
  plan.warm.forEach((w, i) => st.push({ k: 'warm', ex: w, dur: w.dur, timed: true, half: w.uni, setLabel: `Move ${i + 1} of ${plan.warm.length}`, note: w.uni ? 'Switch sides at the beep' : '' }));
  R(15, 'Set up');
  const workFor = (it, s, extra) => {
    const ex = it.ex, base = { ex, note: it.note || '', ...extra };
    if (ex.kind === 'h') {
      const h = it.holdList ? it.holdList[s] : it.hold;
      if (ex.uni) { W({ ...base, timed: true, dur: h, side: 'Side 1' }); R(5, 'Switch sides'); W({ ...base, timed: true, dur: h, side: 'Side 2' }); }
      else W({ ...base, timed: true, dur: h });
    } else W({ ...base, timed: false, est: estSet(it, s), target: repText(it, s) });
  };
  plan.blocks.forEach((b, bi) => {
    if (bi > 0) R(b.blockRest || TRANS, b.blockRest ? 'Next block' : 'Next exercise');
    const head = blockHead(b, bi, plan);
    if (b.type === 'straight') {
      b.items.forEach((it, ii) => {
        if (ii > 0) R(TRANS, 'Next exercise');
        for (let s = 0; s < it.sets; s++) { workFor(it, s, { setLabel: `Set ${s + 1} of ${it.sets}`, block: `Exercise ${ii + 1} of ${b.items.length}` }); if (s < it.sets - 1) R(it.rest, 'Rest'); }
      });
    } else if (b.type === 'superset' || b.type === 'giant') {
      for (let r = 0; r < b.rounds; r++) {
        b.items.forEach((it, ii) => { workFor(it, 0, { setLabel: `Round ${r + 1} of ${b.rounds}`, block: `${head.t} · ${head.tag(ii)}` }); if (ii < b.items.length - 1) R(b.inner, 'Next move'); });
        if (r < b.rounds - 1) R(b.roundRest, 'Round rest');
      }
    } else if (b.type === 'circuit') {
      for (let r = 0; r < b.rounds; r++) {
        b.items.forEach((it, ii) => { W({ ex: it.ex, timed: true, dur: 40, half: it.ex.uni, note: it.ex.uni ? 'Switch sides at the beep' : 'Steady pace, good form', setLabel: `Round ${r + 1} of ${b.rounds} · move ${ii + 1} of ${b.items.length}`, block: head.t }); if (ii < b.items.length - 1) R(20, 'Next move'); });
        if (r < b.rounds - 1) R(b.roundRest, 'Round rest');
      }
    } else if (b.type === 'emom') {
      for (let m = 0; m < b.minutes; m++) { const it = b.items[m % b.items.length]; W({ ex: it.ex, timed: true, dur: 60, emom: repText(it), note: 'Rest for what is left of the minute', setLabel: `Minute ${m + 1} of ${b.minutes}`, block: head.t }); }
    } else if (b.type === 'tabata') {
      for (let j = 0; j < 8; j++) { const it = b.items[j % 2]; W({ ex: it.ex, timed: true, dur: 20, note: 'All out', setLabel: `Interval ${j + 1} of 8`, block: head.t }); if (j < 7) R(10, 'Rest'); }
    } else if (b.type === 'amrap') {
      st.push({ k: 'amrap', timed: true, dur: b.minutes * 60, items: b.items, block: head.t });
    }
  });

  plan.cool.forEach((c, i) => st.push({ k: 'cool', ex: c, dur: c.dur, timed: true, half: c.uni, setLabel: `Stretch ${i + 1} of ${plan.cool.length}`, note: c.uni ? 'Switch sides at the beep' : 'Breathe slowly' }));
  return st;
}
/* Timer off: no countdowns, no rests, no auto-advance. Every step waits for Next. */
function stepsFor(plan) {
  const st = compile(plan);

  return st.filter(s => s.k !== 'rest' && s.k !== 'ready').map(s => ({ ...s, timed: false, est: s.est || s.dur || 0, half: false }));
}
const stepDur = s => s.timed ? s.dur : (s.est || 0);

  const sets = steps.filter(s => s.k === 'work' && s.side !== 'Side 2').length;

/* ---------- body map ---------- */

function pickVoice() { try { const v = speechSynthesis.getVoices(); voice = v.find(x => /^en(-|_)US/i.test(x.lang) && /Samantha|Google US|Aaron|Nicky/i.test(x.name)) || v.find(x => /^en/i.test(x.lang)) || null; } catch (e) { } }
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) { }
function say(t, unlock) {
  if (!S.sound || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(t); if (voice) u.voice = voice;
    u.lang = 'en-US'; u.rate = 1.05; u.volume = unlock ? 0 : 1;
    if (!unlock) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { }
}
function advance() {
  const s = P.steps[P.i];
  if (s.k === 'work' && s.side !== 'Side 1') P.sets++;
  if (s.k === 'amrap') P.amrapLog.push(P.rounds);
  if (P.i >= P.steps.length - 1) return finish();
  enter(P.i + 1);
}
function back() { for (let j = P.i - 1; j >= 0; j--) if (P.steps[j].k !== 'rest') return enter(j); }
function tick() {
  if (!P) return;
  const now = performance.now(), dt = (now - P.last) / 1000; P.last = now;
  if (P.finished || P.paused || P.confirm) return;
  P.elapsed += dt; P.stepEl += dt;
  const s = P.steps[P.i];
  if (s.timed) {
    const before = P.left; P.left -= dt;
    const c = Math.ceil(P.left);
    if (c !== Math.ceil(before)) {
      if (c >= 1 && c <= 3) say(String(c));
      else if (c === 5 && s.dur > 7) say('5');
    }
    if (s.half && before > s.dur / 2 && P.left <= s.dur / 2) beep(880, .25);
    if (P.left <= 0) { beep(s.k === 'rest' ? 990 : 520, .4, .22); advance(); return; }
  }
  live();
}
function remaining() {
  const s = P.steps[P.i];
  let t = s.timed ? Math.max(0, P.left) : Math.max(0, (s.est || 0) - P.stepEl);
  for (let j = P.i + 1; j < P.steps.length; j++) t += stepDur(P.steps[j]);
  return t;
}
function live() {
  const el = $('#plEl'); if (!el) return;
  el.textContent = clock(P.elapsed);
  const rem = remaining();
  $('#plLeft').textContent = S.timer ? `${P.paused ? 'Paused · ' : ''}${Math.ceil(rem / 60)} min left` : `Step ${P.i + 1} of ${P.steps.length}`;
  $('#plBar').style.width = (P.elapsed / Math.max(1, P.elapsed + rem) * 100).toFixed(1) + '%';
  const s = P.steps[P.i];
  const rt = $('#ringT'), fg = $('#ringFg');
  if (s.timed && rt) { rt.textContent = clock(P.left); if (fg) fg.style.strokeDashoffset = (RC * (1 - Math.max(0, P.left) / s.dur)).toFixed(1); }
  const sw = $('#setClock'); if (sw) sw.textContent = clock(P.stepEl);
  const nx = $('#nxBtn');
  if (nx) {
    const frac = !S.timer ? 0 : s.timed ? 1 - Math.max(0, P.left) / s.dur : s.est ? Math.min(1, P.stepEl / s.est) : 0;
    nx.style.setProperty('--p', (frac * 100).toFixed(1) + '%');
  }
}
const RC = 2 * Math.PI * 46;
const ring = (s, cls, label) => `<div class="ringwrap ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" id="ringFg" cx="50" cy="50" r="46" stroke-dasharray="${RC.toFixed(1)}" stroke-dashoffset="0"/></svg>
  <div class="rt"><b id="ringT" class="num${s.dur >= 600 ? ' long' : ''}">${clock(P.left)}</b><span>${label}</span></div></div>`;
const face = (s, cls, label) => S.timer && s.timed ? ring(s, cls, label) : `<div class="ringwrap ${cls} plain"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/></svg><div class="rt"><b id="setClock" class="num">${clock(P.stepEl)}</b><span>elapsed</span></div></div>`;
function nextWork(from) { for (let j = from + 1; j < P.steps.length; j++) { const s = P.steps[j]; if (s.k !== 'rest') return s; } return null; }
function stepTitle(s) { return s.k === 'amrap' ? s.block : s.ex ? s.ex.name : ''; }
function stepSub(s) {
  if (!s) return '';
  if (s.k === 'amrap') return `${s.dur / 60} min, as many rounds as possible`;
  if (s.k === 'warm' || s.k === 'cool') return `${s.dur} sec`;
  return [s.setLabel, s.emom || s.target || (s.timed ? s.dur + ' sec' : ''), s.side].filter(Boolean).join(' · ');
}
const howStage = ex => stageHTML(ex, ex.cues, 'fill');
const miniSm = (pri, sec) => `<div class="mini sm" aria-hidden="true">${bodySVG('front', 'mini', { pri, sec })}${bodySVG('back', 'mini', { pri, sec })}</div>`;
const nextCard = (n, label) => n ? `<div class="next">${n.ex ? thumb(n.ex, 0) : ''}<div><span class="label">${label}</span><strong>${esc(stepTitle(n))}</strong><small>${esc(stepSub(n))}</small></div></div>` : '';
function renderPlayer() {
  const root = $('#player');
  if (P.finished) return renderFinish();
  const s = P.steps[P.i];
  let body = '', ctr = '';
  const last = P.i >= P.steps.length - 1;
  const tone = s.k === 'rest' || s.k === 'cool' ? 'rest' : s.k === 'warm' || s.k === 'ready' ? 'warm' : '';
  const lbl = `<span class="lbl">${last ? 'Finish' : 'Next'}${last ? ico('check') : ico('arrow')}</span>`;
  const ctr0 = `<button class="ctrl back" data-act="pl-prev" aria-label="Back" ${P.i ? '' : 'disabled'}>${ico('prev')}</button>
    <button class="ctrl nx ${tone}" id="nxBtn" data-act="pl-skip" aria-label="${last ? 'Finish workout' : 'Next'}"><span class="fill" aria-hidden="true">${lbl}</span>${lbl}</button>`;
  if (s.k === 'ready') {
    const n = nextWork(P.i);
    body = `<div class="phase"><span class="dot warm">Get ready</span><span>${esc(P.name)} · ${P.minutes} min</span></div>
      <h1 class="pl-name">Here we go</h1>${ring(s, 'warm', 'starting')}
      ${nextCard(n, 'First')}`;
    ctr = ctr0;
  } else if (s.k === 'rest') {
    const n = nextWork(P.i);
    body = `<div class="phase"><span class="dot rest">${esc(s.label)}</span></div>${ring(s, 'rest', 'rest')}
      <div class="chips" style="justify-content:center"><button class="chip" data-act="pl-more">+15 sec</button></div>
      ${nextCard(n, 'Up next')}`;
    ctr = ctr0;
  } else if (s.k === 'amrap') {
    body = `<div class="phase"><span class="dot">AMRAP</span><span>${esc(s.block)}</span></div>
      <h1 class="pl-name">Max rounds</h1>
      <div class="trow">${face(s, 'sm', 'left')}<div class="rounds"><div><span class="label">Rounds done</span><b class="num" id="rnd">${P.rounds}</b></div>
        <div class="grp"><button class="pbtn" data-act="pl-rnd" data-d="-1" aria-label="One round less">${ico('minus')}</button><button class="pbtn" data-act="pl-rnd" data-d="1" aria-label="One round more" style="background:var(--accent);color:var(--accent-ink)">${ico('plus')}</button></div></div></div>
      <ul class="amlist fill">${s.items.map(it => `<li>${thumb(it.ex)}<b>${esc(it.ex.name)}</b><span>${esc(repText(it, null, true))}</span></li>`).join('')}</ul>`;
    ctr = ctr0;
  } else {
    const ex = s.ex, muscles = ex.pri || ex.m || [];
    const phase = s.k === 'warm' ? '<span class="dot warm">Warm-up</span>' : s.k === 'cool' ? '<span class="dot rest">Cool-down</span>' : '<span class="dot">Work</span>';
    const cls = s.k === 'warm' ? 'warm' : s.k === 'cool' ? 'rest' : '';
    let target;
    const mini = miniSm(muscles, ex.sec || []);
    const timed = S.timer && s.timed;
    if (timed && s.emom) target = `<div class="trow">${ring(s, cls + ' sm', 'minute')}<div class="target"><div class="v num">${parseInt(s.emom, 10)}</div><div class="t">${s.emom.includes('sec') ? 'sec' : 'reps'}${ex.uni ? ' each side' : ''}<small>then rest until the minute ends</small></div></div>${mini}</div>`;
    else if (timed) target = `<div class="trow">${ring(s, cls + ' sm', s.side || (s.k === 'work' ? 'work' : 'left'))}<div class="tnote">${esc(s.note || (s.k === 'warm' ? 'Easy pace, warm up the joints' : s.k === 'cool' ? 'Breathe slowly and relax into it' : 'Keep good form'))}</div>${mini}</div>`;
    else {
      const tv = s.target || s.emom || (s.dur ? s.dur + ' sec' : ''), num = tv.split(' ')[0], unit = /sec/.test(tv) ? 'sec' : 'reps';
      const hint = s.target || s.emom ? (s.note && s.k === 'work' ? esc(s.note) + ' · ' : '') : (s.note ? esc(s.note) + ' · ' : '');
      target = `<div class="trow"><div class="target"><div class="v num${num.includes('–') ? ' range' : ''}">${esc(num)}</div><div class="t">${unit}${ex.uni ? ' each side' : ''}<small>${hint}${S.timer ? 'Set' : 'Elapsed'} <span id="setClock" class="num">0:00</span></small></div></div>${mini}</div>`;
    }
    body = `<div class="phase">${phase}<span>${esc([s.block || s.setLabel, s.block ? s.setLabel : '', s.side].filter(Boolean).join(' · '))}</span></div>
      <h1 class="pl-name">${esc(ex.name)}</h1>
      ${target}${howStage(ex)}`;
    ctr = ctr0;
  }
  root.innerHTML = `<div class="in ${s.k === 'warm' ? 'tone-warm' : s.k === 'cool' ? 'tone-cool' : ''}">
    <div class="pl-top"><button class="pbtn" data-act="pl-close" aria-label="End workout">${ico('x')}</button>
      <div class="pl-clock"><b id="plEl" class="num">0:00</b><span id="plLeft"></span></div>
      <div class="pl-tools">${S.timer ? `<button class="pbtn ${P.paused ? 'on' : ''}" data-act="pl-pause" aria-label="${P.paused ? 'Resume timer' : 'Pause timer'}">${ico(P.paused ? 'play' : 'pause')}</button>` : ''}<button class="pbtn" data-act="pl-sound" aria-label="${S.sound ? 'Mute sounds' : 'Turn sounds on'}">${ico(S.sound ? 'sound' : 'mute')}</button></div></div>
    <div class="pl-prog"><i id="plBar"></i></div>
    <div class="pl-body">${body}</div>
    <div class="ctrls">${ctr}</div></div>
    ${P.confirm ? `<div class="modal"><div class="box" role="alertdialog" aria-labelledby="mT"><h3 id="mT">End workout?</h3><p>You're ${clock(P.elapsed)} in with ${P.sets} sets done.</p>
      <div class="row"><button data-act="pl-keep">Keep going</button><button class="danger" data-act="pl-end">End</button></div></div></div>` : ''}`;
  mountStages(root);
  live();
}
function finish() {
  P.finished = true; clearInterval(ticker);
  S.history.unshift({ name: P.name, at: Date.now(), min: Math.round(P.elapsed / 60), muscles: P.muscles }); save();
  renderFinish();
}
function renderFinish() {
  const exCount = new Set(P.steps.slice(0, P.i + 1).filter(s => s.k === 'work').map(s => s.ex.id)).size;
  $('#player').innerHTML = `<div class="in"><div class="fin">
    <span class="label">${esc(P.name)} complete</span><h1>Done.</h1>
    <div class="stats"><div><b class="num">${clock(P.elapsed)}</b><span>Time</span></div><div><b class="num">${P.sets}</b><span>Sets</span></div><div><b class="num">${exCount}</b><span>Exercises</span></div></div>
    ${P.amrapLog.length ? `<p class="lede">AMRAP rounds: ${P.amrapLog.join(' + ')}</p>` : ''}
    <div class="chips">${P.muscles.map(m => `<span class="chip" aria-pressed="true">${MSHORT[m]}</span>`).join('')}</div>
    <div class="mini" style="justify-content:flex-start">${bodySVG('front', 'mini', { pri: P.muscles })}${bodySVG('back', 'mini', { pri: P.muscles })}</div>
    <button class="cta" data-act="pl-exit">Back to start</button></div></div>`;
}
function closePlayer() {
  clearInterval(ticker); P = null; $('#player').hidden = true; $('#player').innerHTML = ''; document.body.style.overflow = '';
  try { wake && wake.release(); } catch (e) { } wake = null;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const path = e.target.closest('svg.body.tap path.m');
  if (path) { const m = path.dataset.m; S.muscles.has(m) ? S.muscles.delete(m) : S.muscles.add(m); resetPlan(); return render(true); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch (a) {
    case 'goto': S.step = +d.i; render(); break;
    case 'next': if (canGo(S.step + 1)) { S.step++; render(); } break;
    case 'prev': S.step = Math.max(0, S.step - 1); render(); break;
    case 'muscle': S.muscles.has(d.m) ? S.muscles.delete(d.m) : S.muscles.add(d.m); resetPlan(); render(true); break;
    case 'split': S.muscles = new Set(d.v.split(',')); resetPlan(); render(true); break;
    case 'clear': S.muscles.clear(); resetPlan(); render(true); break;
    case 'equip': S.equip.has(d.e) ? S.equip.delete(d.e) : S.equip.add(d.e); resetPlan(); render(true); break;
    case 'preset': S.equip = new Set(d.v.split(',')); resetPlan(); render(true); break;
    case 'add-bw': S.equip.add('bw'); resetPlan(); render(true); break;
    case 'fmt': S.fmt = d.f; resetPlan(); render(true); break;
    case 'shuffle': S.seed++; resetPlan(); render(true); toast('New exercise picks'); break;
    case 'timer': S.timer = d.v === '1'; save(); render(true); break;
    case 'pool': openPool(); break;
    case 'mview': S.mview = d.v; render(true); break;
    case 'tips': { const st = document.getElementById(d.for); if (!st) break; const box = st.querySelector('.tipbox'), btn = st.querySelector('.tp'); const open = box.hidden; box.hidden = !open; btn.setAttribute('aria-expanded', open); S.tips = open; break; }
    case 'skip': { const id = +d.id; S.excluded.has(id) ? S.excluded.delete(id) : S.excluded.add(id); resetPlan(); render(true); if (!$('#sheet').hidden) { $('#sheet').dataset.mode === 'pool' ? openPool() : openInfo(id); } break; }
    case 'info': openInfo(+d.id); break;
    case 'kf': { const an = ANIMS.get(d.for); if (!an) break; const i = +d.i; if (an.pinned === i && !an.static) an.play(); else an.show(i); break; }
    case 'stage': { const an = ANIMS.get(d.for); if (!an || an.static) break; if (an.pinned != null) an.play(); else an.show(an.last < 0 ? 0 : an.last); break; }
    case 'sheet-close': closeSheet(); break;
    case 'min': S.minutes = Math.min(120, Math.max(10, S.minutes + +d.d)); resetPlan(); render(true); break;
    case 'setmin': S.minutes = +d.v; resetPlan(); render(true); break;
    case 'swap': swapItem(+d.b, +d.i); break;
    case 'go': startWorkout(); break;
    case 'pl-skip': advance(); break;
    case 'pl-prev': back(); break;
    case 'pl-pause': P.paused = !P.paused; renderPlayer(); break;
    case 'pl-more': P.left += 15; P.steps[P.i].dur += 15; live(); break;
    case 'pl-rnd': P.rounds = Math.max(0, P.rounds + +d.d); $('#rnd').textContent = P.rounds; if (+d.d > 0) beep(740, .08); break;
    case 'pl-sound': S.sound = !S.sound; save(); renderPlayer(); break;
    case 'pl-close': P.confirm = true; renderPlayer(); break;
    case 'pl-keep': P.confirm = false; P.last = performance.now(); renderPlayer(); break;
    case 'pl-end': if (P.sets > 0) finish(); else closePlayer(); render(true); break;
    case 'pl-exit': closePlayer(); S.step = 0; render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (P && !P.finished && !P.confirm) { P.confirm = true; renderPlayer(); } }
});
document.addEventListener('visibilitychange', () => { if (P && !P.finished && document.visibilityState === 'visible') lockScreen(); });

/* ---------- boot (keeps an open workout across page updates) ---------- */
function start(data) {
  load();
  if (data && data.s) {
    const d = data.s; if (typeof d.timer === 'boolean') S.timer = d.timer; S.step = d.step; S.muscles = new Set(d.muscles); S.equip = new Set(d.equip); S.minutes = d.minutes; S.fmt = d.fmt; S.seed = d.seed; S.swaps = d.swaps || []; S.excluded = new Set(d.excluded || []);
  }
  if (S.step >= 1 && !canGo(S.step)) S.step = 0;
  render();
  if (data && data.p) {
    startWorkout(); const p = data.p;
    if (p.i < P.steps.length) { Object.assign(P, { elapsed: p.elapsed, sets: p.sets, amrapLog: p.amrapLog || [] }); enter(p.i); P.left = p.left; P.paused = true; renderPlayer(); }
  }
}
window.claude?.hot?.snapshot?.(() => ({
  s: { timer: S.timer, step: S.step, muscles: [...S.muscles], equip: [...S.equip], minutes: S.minutes, fmt: S.fmt, seed: S.seed, swaps: S.swaps, excluded: [...S.excluded] },
  p: P && !P.finished ? { i: P.i, left: P.left, elapsed: P.elapsed, sets: P.sets, amrapLog: P.amrapLog } : null
}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
